[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pubmed-markdown"
version = "0.1.1"
description = "Convert PubMed articles (PMIDs or PMCIDs) to clean, structured markdown with full text, abstracts, and supplementary materials"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Shlok Natarajan", email = "shlok.natarajan@gmail.com" },
]
keywords = ["pubmed", "pmc", "markdown", "bioinformatics", "LLM", "text-mining"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.32.0",
    "beautifulsoup4>=4.13.0",
    "loguru>=0.7.0",
    "tqdm>=4.67.0",
    "biopython>=1.85",
    "python-dotenv>=1.0.0",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/shloknatarajan/PubMedDownloader"
Repository = "https://github.com/shloknatarajan/PubMedDownloader"
Issues = "https://github.com/shloknatarajan/PubMedDownloader/issues"

[project.scripts]
pubmed-download = "pubmed_markdown.core:main"

[tool.hatch.build.targets.wheel]
packages = ["pubmed_markdown"]
