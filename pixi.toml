[project]
authors = ["Shlok Natarajan <shlok.natarajan@gmail.com>"]
channels = ["conda-forge"]
name = "pmid-article-resolver"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
update-records = "python -m pubmed_markdown.manage_records"
convert-local-pmids = "python -m pubmed_markdown.core --file_path=data/pmids.txt"
black = "python -m black ."
run-api = "uvicorn api:app --host 0.0.0.0 --port 8000 --reload"

[dependencies]
python-dotenv = ">=1.1.0,<2"
requests = ">=2.32.3,<3"
loguru = ">=0.7.3,<0.8"
ipykernel = ">=6.29.5,<7"
pandas = ">=2.2.3,<3"
tqdm = ">=4.67.1,<5"
biopython = ">=1.85,<2"
beautifulsoup4 = ">=4.13.4,<5"
black = ">=25.1.0,<26"
playwright = ">=1.47.2,<2"
fastapi = ">=0.115,<1"
uvicorn = ">=0.34,<1"
slowapi = ">=0.1.9,<1"
